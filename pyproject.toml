[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agrifusenet"
version = "1.0.0"
description = "Background-free multi-organ feature fusion for sugarcane variety identification"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Tassadaq Hussain"}, {name = "Kamran Younis"}]
keywords = ["sugarcane", "variety identification", "multi-organ fusion", "segment anything", "data leakage",
            "shortcut learning"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "scikit-image>=0.21",
    "opencv-python>=4.8",
    "pillow>=10",
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=0.9.16",
    "psutil>=5.9",
]

[project.urls]
Archive = "https://doi.org/10.5281/zenodo.24151375"
Dataset = "https://doi.org/10.5281/zenodo.18619387"

[project.optional-dependencies]
sam3 = ["transformers>=5.0"]

[tool.setuptools]
packages = ["agrifusenet"]
